name: Stock Auto Update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - monitor
          - volume
          - daily
          - monthly
  schedule:
    # Asia/Shanghai 09:00, Monday-Friday, for concise A-share morning brief.
    - cron: "0 1 * * 1-5"
    # Asia/Shanghai 09:45, Monday-Friday, after the open stabilizes.
    - cron: "45 1 * * 1-5"
    # Asia/Shanghai 10:15-11:45, Monday-Friday, intraday abnormal volume alerts only.
    - cron: "15,45 2-3 * * 1-5"
    # Asia/Shanghai 13:15-14:45, Monday-Friday, intraday abnormal volume alerts only.
    - cron: "15,45 5-6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: stock-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      BARK_ENDPOINT: ${{ secrets.BARK_ENDPOINT }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_SERVER: ${{ vars.BARK_SERVER || 'https://api.day.app' }}
      BARK_GROUP: ${{ vars.BARK_GROUP || '股票提醒' }}
      BARK_LEVEL: ${{ vars.BARK_LEVEL }}
      BARK_SOUND: ${{ vars.BARK_SOUND }}
      BARK_URL: ${{ vars.BARK_URL }}
      PUSH_CHANNELS: ${{ vars.PUSH_CHANNELS || 'bark' }}
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore incremental monitor state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: event-state-${{ github.run_id }}
          restore-keys: |
            event-state-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Decide command
        id: command
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "0 1 * * 1-5" ]]; then
            MODE="morning"
          else
            MODE="volume"
          fi

          case "$MODE" in
            morning) echo "cmd=python run.py --morning" >> "$GITHUB_OUTPUT" ;;
            monitor) echo "cmd=python run.py --monitor" >> "$GITHUB_OUTPUT" ;;
            volume) echo "cmd=python run.py --volume-monitor" >> "$GITHUB_OUTPUT" ;;
            daily) echo "cmd=python run.py" >> "$GITHUB_OUTPUT" ;;
            monthly) echo "cmd=python run.py --monthly" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown mode: $MODE" >&2; exit 1 ;;
          esac

      - name: Run stock updater
        run: ${{ steps.command.outputs.cmd }}

      - name: Ensure state directory
        if: always()
        run: mkdir -p state

      - name: Save incremental monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: event-state-${{ github.run_id }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
