name: Stock Auto Update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "monitor"
        type: choice
        options:
          - monitor
          - volume
          - daily
          - monthly
  schedule:
    - cron: "5,35 1-7 * * 1-5"
    - cron: "15,45 2-6 * * 1-5"
    - cron: "25 7 * * 1-5"
    - cron: "30 12 * * 1-5"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      BARK_ENDPOINT: ${{ secrets.BARK_ENDPOINT }}
      PUSH_CHANNELS: bark
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run monitor
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'monitor' }}
        run: python run.py --monitor

      - name: Run volume monitor
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'volume' }}
        run: python run.py --volume-monitor

      - name: Run daily report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'daily' }}
        run: python run.py

      - name: Run monthly scan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'monthly' }}
        run: python run.py --monthly
